# Render Blueprint for Orbit Software.
#
# Creates three resources: a Postgres database, the Django API, and the Next.js
# site. Render reads this file when you point a Blueprint at the repository, so
# the whole stack is defined here rather than clicked together in the dashboard.
#
# Routing: only the Next.js service is meant to be visited. It proxies /api/*
# through to Django (see frontend/next.config.ts), so the browser stays on one
# origin and no CORS headers are involved. The Django service keeps its own URL
# as well, which is how you reach /admin/ and how the proxy reaches it.
#
# Values marked `sync: false` are not stored in the repository. Render prompts
# for them on first deploy, which is where the Gmail app password belongs.

databases:
  - name: orbit-db
    databaseName: orbit
    user: orbit
    plan: free
    region: frankfurt

services:
  # ---------------------------------------------------------------------------
  # Django API and admin
  # ---------------------------------------------------------------------------
  - type: web
    name: orbit-backend
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 60
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      # Database, wired straight from the instance defined above.
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-db
          property: connectionString

      # Render generates this once and keeps it. Never commit a secret key.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_TIME_ZONE
        value: Africa/Johannesburg

      # .onrender.com covers the public URL, the bare service name covers the
      # private network, and localhost covers Render's health checks.
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,orbit-backend,localhost,127.0.0.1

      # Public company identity. Leave PUBLIC_EMAIL blank until a company
      # mailbox exists: the site and signature hide the row rather than show a
      # dead address.
      - key: COMPANY_NAME
        value: Orbit Software
      - key: COMPANY_LOCATION
        value: South Africa
      - key: PUBLIC_EMAIL
        sync: false
      - key: COMPANY_WEBSITE
        sync: false

      # Private. Where form submissions are emailed.
      - key: NOTIFY_EMAIL
        sync: false

      # Gmail SMTP. The password must be a Google App Password.
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

      # Words the signature must never contain, such as a surname.
      - key: SIGNATURE_FORBIDDEN_TERMS
        sync: false

      # Per-IP limit on public form submissions.
      - key: API_FORM_THROTTLE
        value: 20/hour

      # Only needed if something calls the API from another origin. The site
      # itself does not, because requests are proxied same-origin.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # The website's public origin, e.g. https://orbit-frontend-xxxx.onrender.com
      #
      # Required, not optional. A browser POST reaches Django through the
      # website's proxy carrying the website's Origin header but the backend's
      # host, so Django rejects it as cross-origin unless that origin is
      # trusted here. Without it, signing out and paying both fail with 403.
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      # Where a customer is sent back to after paying. The website, not the API.
      - key: PORTAL_URL
        sync: false

      # Paystack. Leave blank until the account exists: the portal then tells
      # clients card payments are not available rather than taking money.
      # The secret key must never be given to the frontend service.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false

      # The admin login, created on deploy by bootstrap_admin. The free plan
      # has no shell, so this is the only way to get a first login. Clear the
      # password from here once you have signed in and changed it.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  # ---------------------------------------------------------------------------
  # Next.js site
  # ---------------------------------------------------------------------------
  - type: web
    name: orbit-frontend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"

      # Where the Next.js server reaches Django. Only the server uses this, so
      # the browser still talks to one origin and no CORS is involved.
      #
      # This is the backend's PUBLIC https URL, not its private-network
      # host:port, and that is deliberate. Render's free instances can send
      # private network traffic but cannot receive it, so a proxy call to
      # orbit-backend:10000 fails immediately with a 500. The public URL works
      # on every plan and carries TLS on the server-to-server hop as well.
      #
      # Change this if the backend is ever recreated under a different URL.
      - key: API_URL
        value: https://orbit-backend-eek6.onrender.com

      # Blank on purpose: the browser posts to /api/* on this same origin,
      # which next.config.ts proxies through to Django.
      - key: NEXT_PUBLIC_API_URL
        value: ""

      # Used for metadata and Open Graph tags. Set this to the site's own URL.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
