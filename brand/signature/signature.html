<!--
  Orbit Software email signature.

  Company-only on purpose: no personal name, no job title and no phone number.
  Enquiries come back by email.

  Built for email clients, not browsers: tables for layout, inline styles only,
  and a system font stack because Gmail and Outlook strip web fonts. There are
  no images at all, so nothing breaks when a client blocks remote content.

  Replace: __EMAIL__, __WEBSITE__, __LOCATION__.
  The block between IF_EMAIL and END_EMAIL is dropped when no public
  address is configured, so the signature never shows a dead mailbox.
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="620" style="border-collapse:collapse;width:620px;max-width:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

  <!-- Company name, contact rows and mark -->
  <tr>
    <td valign="top" style="padding:0 20px 0 0;">

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr>
          <td style="padding:0 0 2px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:25px;line-height:1.2;color:#071630;letter-spacing:-0.3px;">
            <span style="font-weight:400;">Orbit</span> <span style="font-weight:700;color:#0b5fff;">Software</span>
          </td>
        </tr>
        <tr>
          <td style="padding:0 0 16px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;color:#4b5563;">Website design, hosting and support</td>
        </tr>
      </table>

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
<!--IF_EMAIL-->
        <tr>
          <td width="22" valign="middle" style="padding:0 10px 7px 0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;"><tr>
              <td align="center" valign="middle" width="20" height="20" style="width:20px;height:20px;background-color:#0b5fff;border-radius:10px;color:#ffffff;font-size:11px;font-weight:700;line-height:20px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">&#64;</td>
            </tr></table>
          </td>
          <td valign="middle" style="padding:0 0 7px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;color:#071630;">
            <a href="mailto:__EMAIL__" style="color:#071630;text-decoration:none;">__EMAIL__</a>
          </td>
        </tr>
<!--END_EMAIL-->
        <tr>
          <td width="22" valign="middle" style="padding:0 10px 7px 0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;"><tr>
              <td align="center" valign="middle" width="20" height="20" style="width:20px;height:20px;background-color:#0b5fff;border-radius:10px;color:#ffffff;font-size:10px;font-weight:700;line-height:20px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">W</td>
            </tr></table>
          </td>
          <td valign="middle" style="padding:0 0 7px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;color:#071630;">
            <a href="https://__WEBSITE__" style="color:#071630;text-decoration:none;">__WEBSITE__</a>
          </td>
        </tr>
        <tr>
          <td width="22" valign="top" style="padding:1px 10px 0 0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;"><tr>
              <td align="center" valign="middle" width="20" height="20" style="width:20px;height:20px;background-color:#0b5fff;border-radius:10px;color:#ffffff;font-size:10px;font-weight:700;line-height:20px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">L</td>
            </tr></table>
          </td>
          <td valign="top" style="padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.45;color:#071630;">__LOCATION__</td>
        </tr>
      </table>

    </td>

    <!-- Aperture mark, drawn with nested shapes so it needs no image -->
    <td valign="top" align="center" width="150" style="width:150px;padding:2px 0 0 0;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="border-collapse:collapse;">
        <tr>
          <td align="center" valign="middle" width="74" height="74" style="width:74px;height:74px;background-color:#0b5fff;border-radius:19px;text-align:center;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="border-collapse:collapse;"><tr>

                </tr></table>
              </td>
            </tr></table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:10px 0 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:9px;color:#8a94a6;letter-spacing:2.4px;text-align:center;">BUILD &middot; HOST &middot; SUPPORT</td>
        </tr>
      </table>
    </td>
  </tr>

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;width:100%;">
        <tr>
          <td height="1" colspan="2" style="height:1px;background-color:#d7dde7;font-size:0;line-height:0;">&nbsp;</td>
        </tr>
        <tr>
          <td valign="middle" style="padding:9px 0 9px 0;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:14px;color:#0b5fff;">
            Websites built, hosted and looked after by a software team.
          </td>
          <td valign="middle" align="right" style="padding:9px 0 9px 0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="right" style="border-collapse:collapse;"><tr>
              <td align="center" valign="middle" width="22" height="22" style="width:22px;height:22px;background-color:#071630;border-radius:11px;text-align:center;line-height:22px;">
                <a href="https://www.facebook.com/" style="color:#ffffff;text-decoration:none;font-size:12px;font-weight:700;font-family:Georgia,'Times New Roman',serif;line-height:22px;">f</a>

                <a href="https://www.linkedin.com/" style="color:#ffffff;text-decoration:none;font-size:9px;font-weight:700;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:22px;">in</a>
              </td>
            </tr></table>
          </td>
        </tr>
        <tr>
          <td height="3" colspan="2" style="height:3px;background-color:#0b5fff;font-size:0;line-height:0;">&nbsp;</td>
        </tr>
        <tr>
          <td colspan="2" style="padding:9px 0 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:10px;color:#8a94a6;letter-spacing:1.1px;">
            WEBSITE DESIGN &nbsp;&middot;&nbsp; MANAGED HOSTING &nbsp;&middot;&nbsp; SECURITY &amp; BACKUPS &nbsp;&middot;&nbsp; SUPPORT &nbsp;&middot;&nbsp; DASHBOARDS &nbsp;&middot;&nbsp; CUSTOM SOFTWARE
          </td>
        </tr>
      </table>
    </td>
  </tr>

</table>
